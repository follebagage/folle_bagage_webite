{% load static i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  if('scrollRestoration' in history){ history.scrollRestoration = 'manual'; }
  window.__pendingHash = location.hash;
  if(location.hash){
    history.replaceState(null, '', location.pathname + location.search);
  }
  window.scrollTo(0, 0);
</script>
<title>{% block title %}{% trans "Folle - Wir machen aus Ideen Kleidung" %}{% endblock %}</title>
<meta name="description" content="{% block description %}{% trans "Folle ist eine Textilmanufaktur. Wir begleiten den gesamten Weg von der ersten Idee bis zum fertigen Kleidungsstück." %}{% endblock %}" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Tenaciou';
    src:url('{% static "fonts/Tenaciou-Heavy.woff2" %}') format('woff2'),
        url('{% static "fonts/Tenaciou-Heavy.otf" %}') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --blue:#4B7792;
    --blue-dark:#3c6178;
    --card-bg:#ECECEC;
    --white:#ffffff;
    --font-body:'Poppins',system-ui,sans-serif;
    --font-display:'Poppins',system-ui,sans-serif;
    --font-logo:'Tenaciou',system-ui,cursive;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--blue);
    background:var(--white);
    overflow-x:hidden;
  }
  h1{font-family:var(--font-display);}

  /* ---------- Page-to-page transitions (View Transitions API, progressive enhancement) ---------- */
  @view-transition{navigation:auto;}
  @media (prefers-reduced-motion: no-preference){
    ::view-transition-old(root){animation:pageOut .45s cubic-bezier(.4,0,.2,1) both;}
    ::view-transition-new(root){animation:pageIn .5s cubic-bezier(.2,.7,.2,1) both;}
    @keyframes pageOut{to{transform:translateX(-4%);opacity:0;}}
    @keyframes pageIn{from{transform:translateX(4%);opacity:0;}}
  }

  /* ---------- Load overlay reveal ---------- */
  .load-overlay{
    position:fixed;inset:0;z-index:9999;
    background:var(--blue-dark);
    pointer-events:none;
    transform-origin:top;
    animation:overlayReveal .9s cubic-bezier(.6,0,.2,1) .05s both;
  }
  @keyframes overlayReveal{
    0%{transform:scaleY(1);}
    60%{transform:scaleY(1);}
    100%{transform:scaleY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .load-overlay{display:none;}
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .screen-reader-text{
    position:absolute!important;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
  }

  /* ---------- Header ---------- */
  header.site-header{
    position:sticky;top:0;z-index:100;
    background:var(--blue);
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 5%;
    flex-wrap:wrap;
    gap:12px;
    transition:padding .3s ease, box-shadow .3s ease;
  }
  header.site-header.is-scrolled{
    padding:11px 5%;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
  }
  .logo{
    font-family:var(--font-logo);
    font-weight:400;
    font-size:clamp(27px,3.4vw,36px);
    color:var(--white);
    letter-spacing:0.03em;
    display:inline-block;
    line-height:1;
    opacity:0;
    animation:navEntrance .7s cubic-bezier(.2,.7,.2,1) both;
  }
  .header-right{display:flex;align-items:center;gap:clamp(18px,3vw,44px);}
  nav.main-nav{display:flex;gap:clamp(18px,3vw,44px);flex-wrap:wrap;}
  nav.main-nav a{
    position:relative;
    color:var(--white);
    font-weight:600;
    font-size:clamp(15px,1.4vw,17px);
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:4px 0;
    opacity:0;
    animation:navEntrance .6s cubic-bezier(.2,.7,.2,1) both;
  }
  nav.main-nav a:nth-child(1){animation-delay:.14s;}
  nav.main-nav a:nth-child(2){animation-delay:.22s;}
  nav.main-nav a:nth-child(3){animation-delay:.30s;}
  nav.main-nav a:nth-child(4){animation-delay:.38s;}
  @keyframes navEntrance{
    from{opacity:0;transform:translateY(-10px);}
    to{opacity:1;transform:translateY(0);}
  }
  nav.main-nav a::after{
    content:"";
    position:absolute;left:0;bottom:0;
    width:0;height:2px;
    background:var(--white);
    transition:width .25s ease;
  }
  nav.main-nav a:hover::after,
  nav.main-nav a:focus-visible::after{width:100%;}
  @media (prefers-reduced-motion: reduce){
    .logo, nav.main-nav a{animation:none;opacity:1;}
  }
  .lang-switch{display:flex;gap:6px;margin:0;}
  .lang-btn{
    background:none;border:1px solid rgba(255,255,255,0.5);
    color:var(--white);font-weight:700;font-size:13px;
    padding:4px 9px;cursor:pointer;font-family:inherit;
    opacity:0.7;
  }
  .lang-btn:hover{opacity:1;}
  .lang-btn.is-active{background:var(--white);color:var(--blue);opacity:1;}

  /* ---------- Mobile menu toggle ---------- */
  .menu-toggle{
    display:none;
    width:32px;height:24px;
    padding:0;border:none;background:none;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
  }
  .menu-toggle span,
  .menu-toggle span::before,
  .menu-toggle span::after{
    content:"";
    position:absolute;left:0;right:0;
    height:2px;background:var(--white);
    border-radius:2px;
    transition:transform .3s ease, opacity .3s ease, top .3s ease;
  }
  .menu-toggle span{top:11px;}
  .menu-toggle span::before{top:-9px;}
  .menu-toggle span::after{top:9px;}
  .menu-toggle.is-open span{background:transparent;}
  .menu-toggle.is-open span::before{top:0;transform:rotate(45deg);background:var(--white);}
  .menu-toggle.is-open span::after{top:0;transform:rotate(-45deg);background:var(--white);}

  @media (max-width:860px){
    header.site-header{gap:0;}
    .menu-toggle{display:block;}
    .header-right{
      order:3;
      width:100%;
      flex-direction:column;
      align-items:stretch;
      gap:0;
      max-height:0;
      overflow:hidden;
      opacity:0;
      transition:max-height .4s ease, opacity .3s ease;
    }
    .header-right.is-open{
      max-height:70vh;
      opacity:1;
      margin-top:16px;
      overflow-y:auto;
    }
    nav.main-nav{
      flex-direction:column;
      gap:0;
      border-top:1px solid rgba(255,255,255,0.15);
    }
    nav.main-nav a{
      padding:16px 0;
      border-bottom:1px solid rgba(255,255,255,0.15);
      font-size:17px;
    }
    nav.main-nav a::after{display:none;}
    .lang-switch{margin:16px 0 4px;}
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    min-height:300px;
    overflow:hidden;
    background:#111;
  }
  .hero .hero-media{
    position:absolute;inset:0;
    will-change:transform,opacity;
  }
  .hero .hero-media img{
    width:100%;height:100%;object-fit:cover;object-position:center;
    filter:grayscale(100%);
  }
  .hero .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, rgba(75,119,146,0.55) 100%);
  }
  .kontakt-bubble{
    position:absolute;
    z-index:2;
    right:5%;
    bottom:8%;
    background:var(--white);
    color:var(--blue);
    border-radius:0;
    font-weight:600;
    font-size:clamp(15px,1.4vw,17px);
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:14px 30px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    opacity:0;
    animation:bubbleIn .7s cubic-bezier(.2,.7,.2,1) .5s both;
  }
  @keyframes bubbleIn{
    from{opacity:0;transform:translateY(16px) scale(0.9);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .kontakt-bubble{animation:none;opacity:1;}
  }
  /* Contact CTA is a desktop-only affordance; on tablet/mobile it's reachable via the menu instead. */
  @media (max-width:1024px){
    .kontakt-bubble{display:none;}
  }

  /* ---------- Headline ---------- */
  .headline{
    position:relative;
    z-index:3;
    background:var(--white);
    text-align:center;
    padding:clamp(26px,5vw,52px) 5% clamp(30px,6vw,60px);
    margin-top:clamp(-26px,-2.4vw,-16px);
    border-radius:18px 18px 0 0;
    overflow:hidden;
  }
  .headline::after{
    content:"";
    position:absolute;inset:0;
    background:var(--blue-dark);
    transform-origin:right;
    animation:headlineWipe .8s cubic-bezier(.6,0,.2,1) .05s both;
    pointer-events:none;
  }
  .headline h1{
    margin:0;
    font-weight:700;
    font-style:italic;
    text-transform:uppercase;
    font-size:clamp(28px,5.4vw,66px);
    line-height:1.15;
    letter-spacing:0.01em;
  }
  @keyframes headlineWipe{
    0%{transform:scaleX(1);}
    100%{transform:scaleX(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .headline::after{display:none;}
  }

  /* ---------- Projects / swipe carousel ---------- */
  .projects{
    background:var(--blue);
    padding:clamp(30px,5vw,54px) 0;
    overflow:hidden;
  }
  .projects .projects-head{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 16px;
    max-width:1400px;margin:0 auto clamp(20px,3vw,26px);
    padding:0 5%;
    color:var(--white);
  }
  .projects .projects-head h2{
    margin:0;
    font-family:var(--font-display);
    font-weight:700;
    font-style:italic;
    text-transform:uppercase;
    font-size:clamp(20px,2.6vw,32px);
  }
  .slider{
    position:relative;
  }
  .slider .cards{
    display:flex;
    gap:clamp(14px,2vw,24px);
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:4px 8vw;
    scroll-padding-left:8vw;
  }
  .slider .cards::-webkit-scrollbar{display:none;}
  .slider .card{
    flex:0 0 auto;
    width:min(88vw,420px);
    aspect-ratio:3/4;
    scroll-snap-align:center;
    background:var(--card-bg);
    overflow:hidden;
    position:relative;
    display:block;
    transition:transform .4s cubic-bezier(.2,.7,.2,1), opacity .4s ease, box-shadow .35s ease;
  }
  .slider.has-emphasis .card{
    transform:scale(0.92);
    opacity:0.6;
  }
  .slider.has-emphasis .card.is-centered{
    transform:scale(1);
    opacity:1;
  }
  .slider .card:hover,
  .slider .card:focus-visible{
    transform:translateY(-6px) scale(1);
    opacity:1;
    box-shadow:0 20px 40px rgba(0,0,0,0.28);
  }
  .slider .card img{
    width:100%;height:100%;object-fit:cover;
    color:transparent;
  }
  @media (max-width:640px){
    .slider .card{max-height:min(70vh, 480px);}
  }
  .slider .card .card-label{
    position:absolute;left:0;right:0;bottom:0;
    padding:16px 18px;
    color:var(--white);
    font-weight:700;
    font-size:clamp(15px,1.6vw,19px);
    background:linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 70%);
    transition:transform .45s cubic-bezier(.2,.7,.2,1) .08s, opacity .4s ease .08s;
  }
  .slider.has-emphasis .card .card-label{
    transform:translateY(16px);
    opacity:0;
  }
  .slider.has-emphasis .card.is-centered .card-label,
  .slider .card:hover .card-label,
  .slider .card:focus-visible .card-label{
    transform:translateY(0);
    opacity:1;
  }
  .slider .empty{color:var(--white);padding:0 5%;}
  @media (min-width:900px){
    .slider .cards{padding:4px calc((100% - 1400px)/2 + 40px);scroll-padding-left:calc((100% - 1400px)/2 + 40px);}
  }
  .arrow{
    background:rgba(0,0,0,0.25);
    border:none;cursor:pointer;
    color:var(--white);
    width:44px;height:44px;
    border-radius:50%;
    font-size:22px;
    line-height:1;
    font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease;
  }
  .arrow:hover{background:rgba(0,0,0,0.45);}
  .slider .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    z-index:2;
  }
  .slider .arrow.prev{left:2%;}
  .slider .arrow.next{right:2%;}
  @media (max-width:640px){
    .slider .arrow{display:none;}
  }

  /* ---------- About / Historie ---------- */
  .about{
    position:relative;
    padding:70px 5% 90px;
    text-align:center;
    overflow:hidden;
  }
  .about .fabric-bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    filter:grayscale(100%);
    z-index:0;
  }
  .about .fabric-fade{
    position:absolute;inset:0;
    background:linear-gradient(to bottom, var(--white) 0%, var(--white) 18%, rgba(255,255,255,0.75) 45%, rgba(255,255,255,0.6) 70%, rgba(255,255,255,0.5) 100%);
    z-index:1;
  }
  .about .inner{
    position:relative;z-index:2;
    max-width:900px;margin:0 auto;
  }
  .about p{
    font-size:clamp(16px,2vw,24px);
    line-height:1.6;
    font-weight:500;
    margin:0 0 34px;
  }
  .btn{
    position:relative;
    display:inline-block;
    background:var(--blue);
    color:var(--white);
    font-weight:700;
    font-size:clamp(15px,1.6vw,20px);
    padding:14px 34px;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{background:var(--blue-dark);}
  .btn:disabled{cursor:default;opacity:0.85;}
  .btn.is-loading{color:transparent;}
  .btn.is-loading::after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    width:16px;height:16px;
    margin:-8px 0 0 -8px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:btn-spin .7s linear infinite;
  }
  @keyframes btn-spin{to{transform:rotate(360deg);}}

  /* ---------- Logos marquee ---------- */
  .logos{
    background:var(--white);
    padding:34px 0;
    overflow:hidden;
    border-top:1px solid #eee;
  }
  .logos-track{
    display:flex;
    width:max-content;
    gap:80px;
    align-items:center;
    animation:scrollLogos 26s linear infinite;
  }
  .logos:hover .logos-track{animation-play-state:paused;}
  .logos-track span{
    font-weight:700;
    font-size:22px;
    color:#8a8a8a;
    white-space:nowrap;
    letter-spacing:0.02em;
  }
  @keyframes scrollLogos{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  /* ---------- Contact ---------- */
  .contact{
    background:#f4f6f7;
    padding:70px 5%;
    text-align:center;
  }
  .contact h2{
    font-size:clamp(24px,3.4vw,38px);
    font-weight:800;font-style:italic;
    transform:skewX(-6deg);
    margin:0 0 30px;
  }
  .contact form{
    max-width:560px;margin:0 auto;
    display:grid;gap:14px;text-align:left;
  }
  .contact label{font-size:14px;font-weight:600;}
  .contact input, .contact textarea{
    width:100%;
    padding:12px 14px;
    border:1px solid #cdd7dc;
    font-family:inherit;
    font-size:15px;
    background:var(--white);
    color:var(--blue);
  }
  .contact textarea{min-height:120px;resize:vertical;}
  .contact .btn{justify-self:start;margin-top:6px;}
  .contact .note{font-size:13px;color:#7a8b93;margin-top:14px;}
  .form-thanks{
    display:none;max-width:560px;margin:0 auto;
    font-size:18px;font-weight:600;
  }

  /* ---------- Footer ---------- */
  footer{
    background:var(--blue);
    color:var(--white);
    padding:60px 5% 40px;
  }
  .footer-grid{
    max-width:1100px;margin:0 auto;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:24px;
    text-align:center;
  }
  .footer-grid a{display:block;font-weight:600;font-size:18px;margin:10px 0;}
  .powered-by{
    max-width:1100px;margin:36px auto 0;
    text-align:center;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    opacity:0.7;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.2);
  }
  .footer-grid a:hover{opacity:0.8;}
  .footer-center .mascot{
    width:150px;max-width:100%;height:auto;margin:0 auto;display:block;overflow:visible;
    animation:mascotSway 4.5s ease-in-out infinite;
    transition:transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .footer-center .mascot:hover{transform:scale(1.06) rotate(-2deg);}
  @keyframes mascotSway{
    0%,100%{transform:rotate(-2.5deg) translateY(0);}
    50%{transform:rotate(3deg) translateY(-5px);}
  }
  @media (prefers-reduced-motion: reduce){
    .footer-center .mascot{animation:none;}
  }
  .footer-center .foot-logo{
    font-family:var(--font-logo);
    font-weight:400;font-size:34px;text-align:center;margin-top:6px;
    letter-spacing:0.02em;
  }
  .legal-section{
    max-width:700px;margin:0 auto;padding:90px 5%;color:var(--blue);
  }
  .legal-section h2{
    font-weight:800;font-style:italic;
    text-transform:uppercase;
    font-size:clamp(28px,4.4vw,52px);
    transform:skewX(-6deg);
    margin:0 0 34px;
  }
  .legal-section p{
    font-size:clamp(16px,2vw,20px);
    line-height:1.7;
    font-weight:500;
    margin:0 0 20px;
  }

  /* ---------- Fade-in on scroll ---------- */
  .fade-in{opacity:0;transform:translateY(24px) scale(0.97);transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);}
  .fade-in.is-visible{opacity:1;transform:translateY(0) scale(1);}

  /* ---------- Text reveal: Fade In + Slide Up (ease-out) ---------- */
  .text-reveal,
  .text-reveal-left,
  .text-reveal-right{
    opacity:0;
    transform:translateY(22px);
    transition:opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1);
  }
  .text-reveal-left{transform:translateX(-46px);}
  .text-reveal-right{transform:translateX(46px);}
  .text-reveal.is-visible,
  .text-reveal-left.is-visible,
  .text-reveal-right.is-visible{
    opacity:1;
    transform:translate(0,0);
  }
  .text-stagger > *:nth-child(1){transition-delay:.05s;}
  .text-stagger > *:nth-child(2){transition-delay:.16s;}
  .text-stagger > *:nth-child(3){transition-delay:.27s;}
  .text-stagger > *:nth-child(4){transition-delay:.38s;}
  .text-stagger > *:nth-child(5){transition-delay:.49s;}
  @media (prefers-reduced-motion: reduce){
    .text-reveal,.text-reveal-left,.text-reveal-right{opacity:1;transform:none;transition:none;}
  }

  /* ---------- Text Fade In: plain opacity, no movement ---------- */
  .text-fade{
    opacity:0;
    transition:opacity .7s cubic-bezier(.22,1,.36,1);
  }
  .text-fade.is-visible{opacity:1;}

  /* ---------- Slide Down: matches pro11.org's Elementor "fadeInDown" entrance
     (translate3d(0,-100%,0) -> none, 1.25s ease) used across their headings/paragraphs ---------- */
  .text-slide-down{
    opacity:0;
    transform:translateY(-100%);
    transition:opacity 1.25s ease, transform 1.25s ease;
  }
  .text-slide-down.is-visible{opacity:1;transform:translateY(0);}

  /* ---------- Scale + Fade In: starts smaller, grows while fading in ---------- */
  .text-scale-fade{
    opacity:0;
    transform:scale(0.85);
    transition:opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1);
  }
  .text-scale-fade.is-visible{opacity:1;transform:scale(1);}

  @media (prefers-reduced-motion: reduce){
    .text-fade,.text-slide-down,.text-scale-fade{opacity:1;transform:none;transition:none;}
  }

  /* ---------- Staggered slide-up text reveal (section headings): split by word or letter ---------- */
  .split-reveal .split-mask{
    display:inline-block;
    overflow:hidden;
    vertical-align:top;
    padding-bottom:0.12em;
    margin-bottom:-0.12em;
  }
  .split-reveal .split-piece{
    display:inline-block;
    transform:translateY(115%);
    opacity:0;
    transition:transform .7s cubic-bezier(.22,1,.36,1), opacity .5s ease;
  }
  .split-reveal.is-visible .split-piece{
    transform:translateY(0);
    opacity:1;
  }
  @media (prefers-reduced-motion: reduce){
    .split-reveal .split-piece{transition:none;transform:none;opacity:1;}
  }
  /* Anton has no real italic face, so font-style:italic triggers synthetic oblique.
     Combined with each word/letter sitting in its own overflow:hidden mask, that
     synthetic slant bleeds past the mask's right edge and gets clipped (worst on
     char-split, but word-split trailing characters clip too) - so every split-reveal
     heading disables the faux italic and uses a real skew on the whole element instead,
     matching the same angle as this site's other (non-split) skewed headings. */
  .split-reveal{
    font-style:normal!important;
    transform:skewX(-6deg)!important;
  }

  /* ---------- Scroll parallax backgrounds ---------- */
  .parallax-bg{will-change:transform;}
  .fabric-bg.parallax-bg{top:-10%;bottom:-10%;}

  @media (max-width:720px){
    .footer-grid{grid-template-columns:1fr;}
  }
  {% block extra_css %}{% endblock %}
</style>
</head>
<body>
<div class="load-overlay" aria-hidden="true"></div>

{% include "partials/header.html" %}

{% block content %}{% endblock %}

{% include "partials/footer.html" %}

<script>
(function(){
  // Page always starts at the very top; if a link pointed at a section
  // (e.g. the "Projekte" nav item), glide there smoothly once the page
  // has settled instead of jumping straight there before the user sees the top.
  if(window.__pendingHash){
    var pendingTarget = document.querySelector(window.__pendingHash);
    if(pendingTarget){
      window.setTimeout(function(){
        pendingTarget.scrollIntoView({behavior:'smooth', block:'start'});
        history.replaceState(null, '', window.__pendingHash);
      }, 1050);
    }
  }

  var form = document.getElementById('contact-form');
  var thanks = document.getElementById('form-thanks');
  var formError = document.getElementById('form-error');
  if(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(formError){ formError.style.display = 'none'; formError.textContent = ''; }
      var submitBtn = form.querySelector('button[type="submit"]');
      if(submitBtn){ submitBtn.disabled = true; submitBtn.classList.add('is-loading'); }

      fetch(form.action, { method: 'POST', body: new FormData(form) })
        .then(function(res){
          var isJson = (res.headers.get('content-type') || '').indexOf('application/json') !== -1;
          if(!isJson){
            throw new Error('{% trans "Nachricht konnte nicht gesendet werden. Bitte versuche es später erneut." %}');
          }
          return res.json().then(function(data){ return {ok: res.ok, data: data}; });
        })
        .then(function(result){
          if(result.ok && result.data && result.data.ok){
            form.style.display = 'none';
            thanks.style.display = 'block';
          } else {
            throw new Error((result.data && result.data.error) || 'error');
          }
        })
        .catch(function(err){
          if(formError){
            formError.textContent = err.message;
            formError.style.display = 'block';
          }
        })
        .finally(function(){
          if(submitBtn){ submitBtn.disabled = false; submitBtn.classList.remove('is-loading'); }
        });
    });
  }

  // Split heading text into words/letters for a staggered slide-up reveal,
  // preserving any <br> line breaks already in the markup.
  var splitEls = document.querySelectorAll('.split-reveal');
  splitEls.forEach(function(el){
    var mode = el.getAttribute('data-split') || 'word';
    var step = mode === 'char' ? 0.03 : 0.08;
    var counter = 0;
    var nodes = Array.prototype.slice.call(el.childNodes);
    var label = nodes.map(function(node){
      return node.nodeType === 3 ? node.textContent : ' ';
    }).join('').replace(/\s+/g, ' ').trim();
    el.setAttribute('aria-label', label);
    el.innerHTML = '';
    nodes.forEach(function(node){
      if(node.nodeType !== 3){ el.appendChild(node); return; }
      var pieces = mode === 'char' ? node.textContent.split('') : node.textContent.split(/(\s+)/);
      pieces.forEach(function(piece){
        if(piece === '') return;
        if(mode === 'word' && /^\s+$/.test(piece)){
          el.appendChild(document.createTextNode(piece));
          return;
        }
        var mask = document.createElement('span');
        mask.className = 'split-mask';
        mask.setAttribute('aria-hidden', 'true');
        var inner = document.createElement('span');
        inner.className = 'split-piece';
        inner.textContent = piece;
        inner.style.transitionDelay = (counter * step).toFixed(3) + 's';
        mask.appendChild(inner);
        el.appendChild(mask);
        counter++;
      });
    });
  });

  var els = document.querySelectorAll('.fade-in, .text-reveal, .text-reveal-left, .text-reveal-right, .split-reveal, .text-fade, .text-slide-down, .text-scale-fade');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        entry.target.classList.toggle('is-visible', entry.isIntersecting);
      });
    }, {threshold:0.15});
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('is-visible'); });
  }

  // Sticky header: shrink + shadow once the page has scrolled
  var header = document.querySelector('header.site-header');
  if(header){
    var onScroll = function(){
      header.classList.toggle('is-scrolled', window.scrollY > 20);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, {passive:true});
  }

  // Mobile dropdown menu
  var menuToggle = document.getElementById('menu-toggle');
  var headerRight = document.getElementById('header-right');
  if(menuToggle && headerRight){
    var closeMenu = function(){
      menuToggle.classList.remove('is-open');
      headerRight.classList.remove('is-open');
      menuToggle.setAttribute('aria-expanded', 'false');
    };
    menuToggle.addEventListener('click', function(){
      var isOpen = headerRight.classList.toggle('is-open');
      menuToggle.classList.toggle('is-open', isOpen);
      menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    headerRight.querySelectorAll('a').forEach(function(link){
      link.addEventListener('click', closeMenu);
    });
    window.addEventListener('resize', function(){
      if(window.innerWidth > 860){ closeMenu(); }
    });
  }

  // Only run scroll-linked effects on devices with a precise pointer (desktop).
  // On touch devices, restyling a large animated image on every scroll frame
  // is expensive and was making the page feel janky/broken while scrolling.
  var isFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  // Hero parallax: subtle scale + fade tied to scroll position
  var heroMedia = document.querySelector('.hero .hero-media');
  if(heroMedia && isFinePointer && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    var hero = document.querySelector('.hero');
    var tickingHero = false;
    var updateHero = function(){
      var rect = hero.getBoundingClientRect();
      var progress = Math.min(Math.max(-rect.top / (rect.height || 1), 0), 1);
      var scale = 1 + progress * 0.12;
      var opacity = 1 - progress * 0.35;
      heroMedia.style.transform = 'scale(' + scale + ')';
      heroMedia.style.opacity = opacity;
      tickingHero = false;
    };
    updateHero();
    window.addEventListener('scroll', function(){
      if(!tickingHero){
        tickingHero = true;
        window.requestAnimationFrame(updateHero);
      }
    }, {passive:true});
  }

  // Swipeable project carousel (native touch scroll-snap, buttons scroll it programmatically, gentle autoplay)
  var track = document.querySelector('.slider .cards');
  if(track){
    var slides = track.querySelectorAll('.card');
    var prevBtn = document.querySelector('.slider .arrow.prev');
    var nextBtn = document.querySelector('.slider .arrow.next');
    var scrollByCard = function(dir){
      var card = slides[0];
      if(!card) return;
      var gap = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap || 0);
      track.scrollBy({left: dir * (card.getBoundingClientRect().width + gap), behavior:'smooth'});
    };
    if(prevBtn){ prevBtn.addEventListener('click', function(){ scrollByCard(-1); }); }
    if(nextBtn){ nextBtn.addEventListener('click', function(){ scrollByCard(1); }); }

    if(slides.length > 1){
      var autoplayTimer = null;
      var autoplayStopped = false;
      var tickAutoplay = function(){
        var atEnd = Math.ceil(track.scrollLeft + track.clientWidth) >= track.scrollWidth;
        if(atEnd){ track.scrollTo({left:0, behavior:'smooth'}); }
        else { scrollByCard(1); }
      };
      var startAutoplay = function(){
        if(autoplayStopped || autoplayTimer) return;
        autoplayTimer = setInterval(tickAutoplay, 4500);
      };
      var stopAutoplay = function(){
        if(autoplayTimer){ clearInterval(autoplayTimer); autoplayTimer = null; }
      };
      // Manual interaction (swipe, click-drag, wheel) stops autoplay for good.
      ['pointerdown','touchstart','wheel'].forEach(function(evt){
        track.addEventListener(evt, function(){ autoplayStopped = true; stopAutoplay(); }, {passive:true, once:true});
      });
      // Only advance while the carousel is actually on screen (mobile included),
      // so it never fights the page's own vertical scroll off-screen or scroll-jacks mid-swipe.
      if('IntersectionObserver' in window){
        var autoplayVisibility = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){ startAutoplay(); } else { stopAutoplay(); }
          });
        }, {threshold:0.6});
        autoplayVisibility.observe(track.closest('.slider'));
      } else {
        startAutoplay();
      }
    }

    // Emphasise the centered slide: peeking neighbours settle back and dim slightly
    if(slides.length > 1 && 'IntersectionObserver' in window){
      track.closest('.slider').classList.add('has-emphasis');
      var centerObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          entry.target.classList.toggle('is-centered', entry.intersectionRatio > 0.6);
        });
      }, {root: track, threshold: [0, 0.6, 1]});
      slides.forEach(function(card){ centerObserver.observe(card); });
    }
  }

  // Vertical parallax for background media (About / Historie fabric texture)
  var parallaxEls = document.querySelectorAll('.parallax-bg');
  if(parallaxEls.length && isFinePointer && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    var tickingParallax = false;
    var updateParallax = function(){
      parallaxEls.forEach(function(el){
        var rect = el.parentElement.getBoundingClientRect();
        var mid = rect.top + rect.height / 2 - window.innerHeight / 2;
        var shift = Math.max(Math.min(mid * -0.08, 40), -40);
        el.style.transform = 'translateY(' + shift + 'px)';
      });
      tickingParallax = false;
    };
    updateParallax();
    window.addEventListener('scroll', function(){
      if(!tickingParallax){
        tickingParallax = true;
        window.requestAnimationFrame(updateParallax);
      }
    }, {passive:true});
  }
})();
</script>
{% block extra_js %}{% endblock %}

</body>
</html>
